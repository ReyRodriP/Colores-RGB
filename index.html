<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="playground-bandera-arcoiris-origen-2024.jpg">
    <link rel="stylesheet" href="style.css">
    <title>RGB</title>
</head>
<body>
    <div class="recuadro">
        <div class="colores" id="red">
            <label for="">Rojo (R)</label> <br>
            <input type="range" min="0" max="255" value="0" id="rojo">
            <div id="valueR">0</div>
        </div>

        <div class="colores" id="green"> 
            <label for="">Verde (G)</label> <br>
            <input type="range" min="0" max="255" value="0" id="verde">
            <div id="valueG">0</div>
        </div>

        <div class="colores" id="blue">
            <label for="">Azul (B)</label> <br>
            <input type="range" min="0" max="255" value="0" id="azul">
            <div id="valueB">0</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
